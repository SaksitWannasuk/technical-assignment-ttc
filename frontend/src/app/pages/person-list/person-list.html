<div class="page-container">
    <div class="header">
        <h3>Person Management</h3>
        <button mat-raised-button color="primary" (click)="openAddModal()">
            Add
        </button>
    </div>

    <table mat-table [dataSource]="people" class="mat-elevation-z2">

        <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef>ID</th>
            <td mat-cell *matCellDef="let person">{{ person.id }}</td>
        </ng-container>

        <ng-container matColumnDef="fullName">
            <th mat-header-cell *matHeaderCellDef>ชื่อ - นามสกุล</th>
            <td mat-cell *matCellDef="let person">{{ person.firstName }} {{ person.lastName }}</td>
        </ng-container>

        <ng-container matColumnDef="address">
            <th mat-header-cell *matHeaderCellDef>ที่อยู่</th>
            <td mat-cell *matCellDef="let person">{{ person.address }}</td>
        </ng-container>

        <ng-container matColumnDef="birthDate">
            <th mat-header-cell *matHeaderCellDef>วันเกิด</th>
            <td mat-cell *matCellDef="let person">
                {{ person.birthDate | date: 'dd-MM-yyyy' }}
            </td>
        </ng-container>

        <ng-container matColumnDef="age">
            <th mat-header-cell *matHeaderCellDef>อายุ</th>
            <td mat-cell *matCellDef="let person">{{ person.age }}</td>
        </ng-container>

        <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef>Action</th>
            <td mat-cell *matCellDef="let person">
                <button mat-button color="primary" (click)="openViewModal(person)">
                    View
                </button>
            </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
</div>
